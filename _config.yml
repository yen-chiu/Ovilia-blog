name: "Blog of Wenli Zhang"
description: "Web Front-End Blog by Wenli Zhang"

url: "https://yenchiu.com/Ovilia-blog"
loadingImg: "https://yenchiu.com/Ovilia-blog/img/loading.gif"
filePath: "https://yenchiu.com/Ovilia-blog/img"

timezone: Asia/Shanghai

paginate: 16
paginate_path: "/page:num"

markdown: kramdown
kramdown:
  input: GFM
highlighter: rouge

permalink: pretty

plugins:
- jekyll-paginate

exclude:
- gulpfile.js
- package.json
- package-lock.json
- README.md
- .gitignore
- .gitattributes
